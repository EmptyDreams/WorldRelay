plugins {
    id 'application'
}

group = 'top.kmar.worldrelay'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.java.srcDir('../shared/src/main/java')

def serverVersion = version.toString()
tasks.named('processResources').configure {
    inputs.property('serverVersion', serverVersion)
    filesMatching('worldrelay-server.properties') {
        expand(serverVersion: serverVersion)
    }
}

application {
    applicationName = 'worldrelay-server'
    mainClass = 'top.kmar.worldrelay.server.WorldRelayServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'io.netty:netty-codec-http:4.1.140.Final'
    implementation 'io.netty:netty-handler:4.1.140.Final'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// 部署仍使用单个可执行 JAR；不展开依赖中的签名及模块描述符。
tasks.named('jar', Jar).configure {
    manifest.attributes('Main-Class': application.mainClass.get(), 'Multi-Release': 'true')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

import net.neoforged.moddevgradle.dsl.ModModel
import net.neoforged.moddevgradle.dsl.RunModel

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
def modId = providers.gradleProperty('mod_id').get()

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = 'Xaero'
        url = 'https://chocolateminecraft.com/maven'
        content { includeGroupByRegex 'xaero\\..*' }
    }
    def createRepository = maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    exclusiveContent {
        forRepositories(createRepository)
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
        }
    }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 两端仅共享不依赖 Minecraft 的快照格式与文件校验代码。
sourceSets.main.java.srcDir('shared/src/main/java')

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client { RunModel run ->
            run.client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            run.systemProperty('neoforge.enabledGameTestNamespaces', modId)
        }

        server { RunModel run ->
            run.server()
            run.programArgument('--nogui')
            run.systemProperty('neoforge.enabledGameTestNamespaces', modId)
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer { RunModel run ->
            run.type.set("gameTestServer")
            run.systemProperty('neoforge.enabledGameTestNamespaces', modId)
        }

        data { RunModel run ->
            run.data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            run.programArguments.addAll '--mod', modId, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach { RunModel run ->
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            run.systemProperty('forge.logging.markers', 'REGISTRIES')

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            // RunModel 的 Property<Level> 已按插件源码及实际构建核对，IDEA 的 Groovy 泛型推断仍无法识别枚举值。
            //noinspection GroovyAssignabilityCheck
            run.logLevel.set(org.slf4j.event.Level.DEBUG)
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" { ModModel mod ->
            mod.sourceSet(sourceSets.getByName('main') as SourceSet)
        }
    }

    unitTest {
        enable()
        testedMod = mods.worldrelay
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 只编译服务端蓝图适配；不把 Create 或其依赖加入发布产物。
    compileOnly('com.simibubi.create:create-1.21.1:6.0.10-281') { transitive = false }
    // 可选兼容只在编译时引用 Xaero；发布 JAR 不打包这些模组。
    compileOnly 'xaero.map:xaeroworldmap-neoforge-1.21.1:1.47.0'
    compileOnly 'xaero.minimap:xaerominimap-neoforge-1.21.1:26.6.0'
    compileOnly 'xaero.lib:xaerolib-neoforge-1.21.1:1.7.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// 可选模组的发布类测试单独启用；普通回归保持未安装这些模组的环境。
def createTests = providers.gradleProperty('createTests').getOrElse('false').toBoolean()
def ipnTestMods = providers.gradleProperty('ipnTestMods')
def jeiTestMods = providers.gradleProperty('jeiTestMods')
if (createTests || ipnTestMods.isPresent() || jeiTestMods.isPresent()) {
    def fixtureAgent = configurations.create('fixtureAgent')
    dependencies {
        testImplementation 'org.mockito:mockito-core:5.24.0'
        add('fixtureAgent', 'org.mockito:mockito-core:5.24.0') { transitive = false }
    }
    tasks.named('test', Test).configure {
        // 显式安装官方测试 agent，避免 JDK 运行时自附加及对应警告。
        jvmArgs "-javaagent:${fixtureAgent.asPath}", '-Xshare:off'
    }
}

if (createTests) {
    sourceSets.test.java.srcDir('src/createTest/java')
    dependencies {
        testImplementation('com.simibubi.create:create-1.21.1:6.0.10-281') { transitive = false }
        // 蓝图桌继承的 Ponder 接口；运行时由 Create JAR 内置的相同版本提供。
        testCompileOnly('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    }
}

// 直接验证整合包发布 JAR；该目录只读取，不安装或改写其中的模组。
if (ipnTestMods.isPresent()) {
    def ipnMods = fileTree(ipnTestMods.get()) {
        include '*InventoryProfilesNext-neoforge-1.21.1-2.2.5.jar'
        include '*libIPN-neoforge-1.21.1-6.6.3.jar'
        include '*kotlinforforge-5.12.0-all.jar'
    }
    if (ipnMods.files.size() != 3) {
        throw new GradleException('ipnTestMods must contain IPN 2.2.5, libIPN 6.6.3 and Kotlin for Forge 5.12.0 (Minecraft 1.21.1 / NeoForge)')
    }
    sourceSets.test.java.srcDir('src/ipnTest/java')
    sourceSets.test.resources.srcDir('src/ipnTest/resources')
    dependencies { testImplementation(ipnMods) }
    tasks.named('prepareNeoForgeTestFiles').configure {
        // forgejunitdev 使用 SERVER 侧，在无画面测试中装配相同的客户端注入。
        programArguments.addAll('--mixin', 'worldrelay.ipn-test.mixins.json')
    }
}

if (jeiTestMods.isPresent()) {
    def jeiMods = fileTree(jeiTestMods.get()) {
        include '*jei-1.21.1-neoforge-19.64.0.455.jar'
        include '*mezz_config-1.21.1-neoforge-0.6.9-standalone.jar'
    }
    if (jeiMods.files.size() != 2) {
        throw new GradleException('jeiTestMods must contain JEI 19.64.0.455 and mezz_config 0.6.9 (Minecraft 1.21.1 / NeoForge)')
    }
    sourceSets.test.java.srcDir('src/jeiTest/java')
    sourceSets.test.resources.srcDir('src/jeiTest/resources')
    dependencies { testImplementation(jeiMods) }
    tasks.named('prepareNeoForgeTestFiles').configure {
        programArguments.addAll('--mixin', 'worldrelay.jei-test.mixins.json')
    }
}

def xaeroTests = providers.gradleProperty('xaeroTests').getOrElse('none')
if (xaeroTests in ['both', 'worldmap', 'minimap']) {
    dependencies {
        testImplementation 'xaero.lib:xaerolib-neoforge-1.21.1:1.7.3'
    }
    if (xaeroTests in ['both', 'worldmap']) {
        sourceSets.test.java.srcDir('src/xaeroWorldMapTest/java')
        sourceSets.test.resources.srcDir('src/xaeroWorldMapTest/resources')
        dependencies { testImplementation 'xaero.map:xaeroworldmap-neoforge-1.21.1:1.47.0' }
        tasks.named('prepareNeoForgeTestFiles').configure {
            // forgejunitdev 使用 SERVER 侧；测试配置将相同客户端注入装配到真实发布类。
            programArguments.addAll('--mixin', 'worldrelay.xaero-worldmap-test.mixins.json')
        }
    }
    if (xaeroTests in ['both', 'minimap']) {
        sourceSets.test.java.srcDir('src/xaeroMinimapTest/java')
        sourceSets.test.resources.srcDir('src/xaeroMinimapTest/resources')
        dependencies { testImplementation 'xaero.minimap:xaerominimap-neoforge-1.21.1:26.6.0' }
        tasks.named('prepareNeoForgeTestFiles').configure {
            programArguments.addAll('--mixin', 'worldrelay.xaero-minimap-test.mixins.json')
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (providers.environmentVariable('WORLDRELAY_SYNC_TEST_API_PORT').isPresent()) {
        // 外部服务的状态不属于 Gradle 输入；显式启用端到端测试时必须实际运行。
        outputs.upToDateWhen { false }
        outputs.doNotCacheIf('Uses an external rsync integration service') { true }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            // 通过模板变量声明平台内置依赖，避免 Minecraft Development 仍按 Forge 类名解析 NeoForge 的 ID。
            neoforge_mod_id        : 'neoforge',
            minecraft_mod_id       : 'minecraft',
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) { MavenPublication publication ->
            publication.from(components.getByName('java') as SoftwareComponent)
        }
    }
    repositories {
        maven {
            url = uri('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

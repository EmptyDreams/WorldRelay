name: Server Native

on:
  workflow_dispatch:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

jobs:
  admin:
    name: Build admin console
    uses: ./.github/workflows/admin.yml

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARTIFACT_NAME: worldrelay-server-linux-${{ matrix.arch }}
      ARM64_NATIVE_BASE: container-registry.oracle.com/graalvm/native-image:25-ol8
      ARM64_NATIVE_IMAGE: worldrelay-native-arm64:build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test compatibility checks and training process
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test server JAR
        run: bash ./gradlew :server:build --no-daemon --console=plain

      - name: Package server JAR
        if: matrix.arch == 'x64'
        run: |
          mkdir -p server/build/release
          cp server/build/libs/server-0.1.0-SNAPSHOT.jar server/build/release/worldrelay-server.jar
          cd server/build/release
          sha256sum worldrelay-server.jar > worldrelay-server.jar.sha256

      - name: Upload server JAR
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: worldrelay-server-jar
          path: |
            server/build/release/worldrelay-server.jar
            server/build/release/worldrelay-server.jar.sha256
          if-no-files-found: error

      - name: Setup GraalVM 25
        if: matrix.arch == 'x64'
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          version: '25.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure native toolchain
        if: matrix.arch == 'x64'
        timeout-minutes: 8
        run: bash .github/scripts/ensure-native-toolchain.sh

      - name: Cache x64 musl toolchain
        if: matrix.arch == 'x64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/worldrelay-musl/toolchain
          key: musl-${{ runner.os }}-${{ runner.arch }}-ubuntu22-${{ hashFiles('.github/scripts/setup-musl.sh') }}

      - name: Prepare x64 musl and static zlib
        if: matrix.arch == 'x64'
        timeout-minutes: 8
        run: bash .github/scripts/setup-musl.sh "$RUNNER_TEMP/worldrelay-musl"

      - name: Verify musl secure directory operations
        if: matrix.arch == 'x64'
        run: bash .github/scripts/test-musl-nio.sh "$RUNNER_TEMP/worldrelay-musl/nio-test"

      - name: Prepare ARM64 glibc 2.28 and static zlib builder
        if: matrix.arch == 'arm64'
        timeout-minutes: 12
        run: |
          timeout --kill-after=10s 360s docker pull --platform linux/arm64 "$ARM64_NATIVE_BASE"
          timeout --kill-after=10s 240s docker build --platform linux/arm64 \
            --build-arg BASE_IMAGE="$ARM64_NATIVE_BASE" --tag "$ARM64_NATIVE_IMAGE" \
            --file .github/docker/server-native-arm64.Dockerfile .github/docker
          docker run --rm --platform linux/arm64 --entrypoint /bin/bash "$ARM64_NATIVE_IMAGE" -c '
            set -euo pipefail
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
            test -f /usr/lib64/libz.a
            # 检查 JDK 实际使用的文件名编码，不能仅凭 LANG 声明判断。
            properties=$(java -XshowSettings:properties -version 2>&1)
            if [[ "$properties" != *"sun.jnu.encoding = UTF-8"* ]]; then
              printf "%s\n" "$properties" >&2
              echo "ARM64 builder requires UTF-8 file names" >&2
              exit 1
            fi
            native-image --version
          '
          mkdir -p server/build/native/licenses/zlib
          docker run --rm --platform linux/arm64 --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/server/build/native/licenses/zlib,dst=/licenses" \
            --entrypoint /bin/bash "$ARM64_NATIVE_IMAGE" -c '
              set -euo pipefail
              rpm -qL zlib zlib-devel zlib-static | while IFS= read -r file; do
                if [[ -f "$file" ]]; then cp -- "$file" /licenses/; fi
              done
              license_files=(/licenses/*)
              test -f "${license_files[0]}"
            '

      - name: Compile instrumented Native Image
        run: |
          mkdir -p server/build/native
          bash .github/scripts/native-image.sh "${{ matrix.arch }}" \
            --no-fallback -march=compatibility -J-Xmx5g -R:MaxHeapSize=512m --pgo-instrument \
            -jar server/build/libs/server-0.1.0-SNAPSHOT.jar \
            -o server/build/native/worldrelay-server-instrumented

      - name: Verify instrumented executable compatibility
        run: |
          python3 -B .github/scripts/check-native-compatibility.py --arch "${{ matrix.arch }}" \
            --report server/build/native/instrumented-compatibility.json server/build/native/worldrelay-server-instrumented

      - name: Run fixed PGO training workload
        run: |
          python3 -B .github/scripts/train-server.py --collect-profiles \
            --work-dir server/build/native/pgo -- server/build/native/worldrelay-server-instrumented

      - name: Compile PGO optimized Native Image
        run: |
          for profile in 1-wss 2-tcp 3-tcp; do
            test -s "server/build/native/pgo/profiles/$profile.iprof"
          done
          bash .github/scripts/native-image.sh "${{ matrix.arch }}" \
            --no-fallback -march=compatibility -J-Xmx5g -R:MaxHeapSize=512m \
            --pgo=server/build/native/pgo/profiles/1-wss.iprof,server/build/native/pgo/profiles/2-tcp.iprof,server/build/native/pgo/profiles/3-tcp.iprof \
            -jar server/build/libs/server-0.1.0-SNAPSHOT.jar \
            -o server/build/native/worldrelay-server

      - name: Verify final executable compatibility
        run: |
          python3 -B .github/scripts/check-native-compatibility.py --arch "${{ matrix.arch }}" \
            --report server/build/native/compatibility.json server/build/native/worldrelay-server

      - name: Verify PGO optimized server with fixed workload
        run: |
          python3 -B .github/scripts/train-server.py \
            --work-dir server/build/native/verify -- server/build/native/worldrelay-server

      - name: Upload PGO profiles and workload reports
        uses: actions/upload-artifact@v7
        with:
          name: server-pgo-linux-${{ matrix.arch }}
          path: |
            server/build/native/pgo/profiles/*.iprof
            server/build/native/pgo/summary.json
            server/build/native/verify/summary.json
            server/build/native/*compatibility.json
          if-no-files-found: error

      - name: Package executable
        run: |
          cp server/README.md server/build/native/README.md
          files=(worldrelay-server README.md licenses)
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            mkdir -p server/build/native/licenses
            cp "$MUSL_TOOLCHAIN/share/licenses/"*.txt server/build/native/licenses/
          fi
          tar -C server/build/native -czf "server/build/$ARTIFACT_NAME.tar.gz" "${files[@]}"
          cd server/build
          sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            server/build/${{ env.ARTIFACT_NAME }}.tar.gz
            server/build/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-native-diagnostics-linux-${{ matrix.arch }}
          path: |
            server/build/reports/tests/test/
            server/build/native/pgo/*.log
            server/build/native/pgo/profiles/*.iprof
            server/build/native/pgo/summary.json
            server/build/native/verify/*.log
            server/build/native/verify/summary.json
            server/build/native/*compatibility.json
          if-no-files-found: ignore

  package:
    name: Package server and admin bundles
    needs: [linux, admin]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download both architectures
        uses: actions/download-artifact@v8
        with:
          pattern: worldrelay-server-linux-*
          merge-multiple: true
          path: release-inputs

      - name: Download admin console
        uses: actions/download-artifact@v8
        with:
          name: worldrelay-admin-linux
          path: release-inputs

      - name: Download server JAR
        uses: actions/download-artifact@v8
        with:
          name: worldrelay-server-jar
          path: release-inputs

      - name: Verify inputs and package four distributions
        run: |
          python3 -B .github/scripts/package-release.py --input-dir release-inputs --output-dir release-assets

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: worldrelay-release
          path: |
            release-assets/worldrelay-linux-*.tar.gz
            release-assets/worldrelay-jar-linux-*.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish server and admin release
    needs: package
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v8
        with:
          name: worldrelay-release
          path: release-assets

      - name: Verify and publish release assets
        working-directory: release-assets
        run: |
          assets=(
            worldrelay-linux-arm64.tar.gz
            worldrelay-linux-x64.tar.gz
            worldrelay-jar-linux-arm64.tar.gz
            worldrelay-jar-linux-x64.tar.gz
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum -c SHA256SUMS
          version="${RELEASE_TAG#server-v}"
          options=()
          if [[ "$version" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            SHA256SUMS \
            --verify-tag --title "WorldRelay Server $version" --generate-notes \
            "${options[@]}"
